<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://bolt.new; connect-src 'self' https://localhost:5001 ws://localhost:5173 wss://localhost:5173 __CSP_CONNECT_SRC__; frame-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>ShieldReport · PentestOps</title>
    <meta name="theme-color" content="#0b0f14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Same-origin file so it satisfies the script-src 'self' CSP above; generated at container
         startup from docker/runtime-config.template.js (see docker/entrypoint.sh) so one built
         image can be re-pointed at a different host:port without rebuilding. No-op for local dev. -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
