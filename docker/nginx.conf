server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # These two are rewritten by entrypoint.sh on every container start, so they must
    # never be cached by the browser between demo deploys.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    # No `$uri/`: a client route that matches a build directory (e.g. /assets, the Client Assets
    # page, vs. Vite's /assets/ output folder) would otherwise be redirected to the directory and
    # answered with 403 on a refresh or deep link. Only real files are served; the rest is the SPA.
    location / {
        try_files $uri /index.html;
    }
}
