server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # These two are rewritten by entrypoint.sh on every container start, so they must
    # never be cached by the browser between demo deploys.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
